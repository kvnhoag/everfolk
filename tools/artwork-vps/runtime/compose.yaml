name: everfolk-art

services:
  origin:
    image: ${NGINX_IMAGE:?Run setup-vps.sh first}
    entrypoint: ["nginx"]
    command: ["-g", "daemon off;", "-c", "/etc/nginx/nginx.conf"]
    user: "101:101"
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    cpus: ${ORIGIN_CPUS:-1.0}
    mem_limit: ${ORIGIN_MEMORY:-256m}
    pids_limit: 64
    ports:
      - "127.0.0.1:${ORIGIN_PORT:-8788}:8080"
    volumes:
      - type: bind
        source: ${EVERFOLK_INSTALL_ROOT:?Run setup-vps.sh first}/nginx.conf
        target: /etc/nginx/nginx.conf
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${EVERFOLK_DATA_ROOT:?Run setup-vps.sh first}/public
        target: /srv/public
        read_only: true
        bind:
          create_host_path: false
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m,uid=101,gid=101,mode=0700
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    networks: [artwork]

  tunnel:
    profiles: [tunnel]
    image: ${CLOUDFLARED_IMAGE:?Run setup-vps.sh first}
    command: ["tunnel", "--no-autoupdate", "run", "--token-file", "/run/secrets/tunnel_token"]
    user: "65532:65532"
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    cpus: ${TUNNEL_CPUS:-0.5}
    mem_limit: ${TUNNEL_MEMORY:-256m}
    pids_limit: 64
    depends_on:
      origin:
        condition: service_healthy
    secrets: [tunnel_token]
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    networks: [artwork]

networks:
  artwork: {}

secrets:
  tunnel_token:
    file: ${EVERFOLK_INSTALL_ROOT:?Run setup-vps.sh first}/secrets/tunnel-token
