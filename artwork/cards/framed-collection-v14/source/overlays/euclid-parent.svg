<g id="Card_text_live" data-name="Card / editable type"><text id="Card_title_live" data-name="Card title live" x="78" y="136.14" font-family="Source Serif 4" font-size="68" font-weight="400" fill="#f0e6cf" text-anchor="start"><tspan x="78" y="136.14">Euclid</tspan></text><text id="Card_subtitle_live" data-name="Card subtitle live" x="80" y="170" font-family="Inter" font-size="19" font-weight="500" fill="#ffe5a1" text-anchor="start" letter-spacing="1.75"><tspan x="80" y="170">GEOMETER OF ALEXANDRIA</tspan></text><text id="Biography_title_live" data-name="Biography title live" x="78" y="1031" font-family="Source Serif 4" font-size="33" font-weight="400" fill="#ffe5a1" text-anchor="start"><tspan x="78" y="1031">The Architecture of Proof</tspan></text><text id="Biography_live" data-name="Biography / editable paragraph" font-family="Source Serif 4" font-size="24" fill="#f2e8d1"><tspan x="78" y="1068">Euclid's Elements organized geometry and number into a</tspan><tspan x="78" y="1095">powerful sequence of definitions, propositions, and proofs.</tspan><tspan x="78" y="1122">Associated with Alexandria, this elusive mathematician gave</tspan><tspan x="78" y="1149">generations a model of knowledge built through reason.</tspan></text><text id="Everfolk_brand_live" data-name="Everfolk brand live" x="96" y="1209.972" font-family="Source Serif 4" font-size="27" font-weight="400" fill="#eee4ce" text-anchor="start" letter-spacing="1.35"><tspan x="96" y="1209.972">EVERFOLK</tspan></text><text id="Edition_number_live" data-name="Edition number live" x="816" y="1207.344" font-family="Inter" font-size="21" font-weight="400" fill="#eee4ce" text-anchor="end" letter-spacing="2.1"><tspan x="816" y="1207.344">001/010</tspan></text></g>
