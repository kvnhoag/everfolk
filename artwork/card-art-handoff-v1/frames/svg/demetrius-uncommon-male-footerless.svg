<g id="Card_text_live" data-name="Card / editable type"><text id="Card_title_live" data-name="Card title live" x="450" y="128.8" font-family="Source Serif 4" font-size="60" font-weight="400" fill="#f0e6cf" text-anchor="middle"><tspan x="450" y="128.8">Siege Workshop Assistant</tspan></text><text id="Card_subtitle_live" data-name="Card subtitle live" x="450" y="163" font-family="Inter" font-size="19" font-weight="500" fill="#d9bc80" text-anchor="middle" letter-spacing="1.75"><tspan x="450" y="163">ARTISAN OF THE BESIEGER</tspan></text><text id="Biography_title_live" data-name="Biography title live" x="96" y="995" font-family="Source Serif 4" font-size="29" font-weight="400" fill="#23332b" text-anchor="start"><tspan x="96" y="995">Every Joint Holds</tspan></text><text id="Biography_live" data-name="Biography / editable paragraph" font-family="Source Serif 4" font-size="24" fill="#23332b"><tspan x="96" y="1040">A workshop assistant shapes fittings and checks the ropes</tspan><tspan x="96" y="1066">that larger engines depend upon. Exact preparation keeps</tspan><tspan x="96" y="1092">immense forces under control, making the smallest sound</tspan><tspan x="96" y="1118">component a quiet ally against the strongest wall.</tspan></text><text id="Rarity_live" data-name="Rarity live" x="804" y="995" font-family="Inter" font-size="17" font-weight="600" fill="#23332b" text-anchor="end" letter-spacing="2"><tspan x="804" y="995">UNCOMMON</tspan></text><text id="Everfolk_brand_live" data-name="Everfolk brand live" x="96" y="1209.972" font-family="Source Serif 4" font-size="27" font-weight="400" fill="#eee4ce" text-anchor="start" letter-spacing="1.35"><tspan x="96" y="1209.972">EVERFOLK</tspan></text></g>
