<g id="Card_text_live" data-name="Card / editable type"><text id="Card_title_live" data-name="Card title live" x="78" y="136.14" font-family="Source Serif 4" font-size="68" font-weight="400" fill="#f0e6cf" text-anchor="start"><tspan x="78" y="136.14">Ptolemy I Soter</tspan></text><text id="Card_subtitle_live" data-name="Card subtitle live" x="80" y="170" font-family="Inter" font-size="19" font-weight="500" fill="#ffe5a1" text-anchor="start" letter-spacing="1.75"><tspan x="80" y="170">FOUNDER OF A DYNASTY</tspan></text><text id="Biography_title_live" data-name="Biography title live" x="78" y="1031" font-family="Source Serif 4" font-size="33" font-weight="400" fill="#ffe5a1" text-anchor="start"><tspan x="78" y="1031">A Kingdom Secured</tspan></text><text id="Biography_live" data-name="Biography / editable paragraph" font-family="Source Serif 4" font-size="24" fill="#f2e8d1"><tspan x="78" y="1068">A general of Alexander, Ptolemy secured Egypt after the</tspan><tspan x="78" y="1095">conqueror's death and later ruled as king. His dynasty made</tspan><tspan x="78" y="1122">Alexandria a royal capital and endured until the age of</tspan><tspan x="78" y="1149">Cleopatra.</tspan></text><text id="Everfolk_brand_live" data-name="Everfolk brand live" x="96" y="1209.972" font-family="Source Serif 4" font-size="27" font-weight="400" fill="#eee4ce" text-anchor="start" letter-spacing="1.35"><tspan x="96" y="1209.972">EVERFOLK</tspan></text></g>
