<g id="Card_text_live" data-name="Card / editable type"><text id="Card_title_live" data-name="Card title live" x="425" y="130.52" font-family="Source Serif 4" font-size="64" font-weight="400" fill="#f0e6cf" text-anchor="middle"><tspan x="425" y="130.52">Alexander the Great</tspan></text><text id="Card_subtitle_live" data-name="Card subtitle live" x="450" y="163" font-family="Inter" font-size="19" font-weight="500" fill="#cfedf1" text-anchor="middle" letter-spacing="1.75"><tspan x="450" y="163">KING OF MACEDON</tspan></text><text id="Biography_title_live" data-name="Biography title live" x="96" y="995" font-family="Source Serif 4" font-size="29" font-weight="400" fill="#203849" text-anchor="start"><tspan x="96" y="995">An Empire Unbound</tspan></text><text id="Biography_live" data-name="Biography / editable paragraph" font-family="Source Serif 4" font-size="24" fill="#203849"><tspan x="96" y="1040">King of Macedon from 336 to 323 BCE, Alexander overthrew</tspan><tspan x="96" y="1066">the Persian Empire and led his army into India. His</tspan><tspan x="96" y="1092">conquests reshaped the ancient world and opened the</tspan><tspan x="96" y="1118">Hellenistic age.</tspan></text><text id="Rarity_live" data-name="Rarity live" x="804" y="995" font-family="Inter" font-size="17" font-weight="600" fill="#203849" text-anchor="end" letter-spacing="2"><tspan x="804" y="995">RARE</tspan></text><text id="Everfolk_brand_live" data-name="Everfolk brand live" x="96" y="1209.972" font-family="Source Serif 4" font-size="27" font-weight="400" fill="#eee4ce" text-anchor="start" letter-spacing="1.35"><tspan x="96" y="1209.972">EVERFOLK</tspan></text></g>
