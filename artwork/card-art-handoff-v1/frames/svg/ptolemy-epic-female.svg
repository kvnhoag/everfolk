<g id="Card_text_live" data-name="Card / editable type"><text id="Card_title_live" data-name="Card title live" x="450" y="130.52" font-family="Source Serif 4" font-size="64" font-weight="400" fill="#f0e6cf" text-anchor="middle"><tspan x="450" y="130.52">Steward of Egypt</tspan></text><text id="Card_subtitle_live" data-name="Card subtitle live" x="450" y="163" font-family="Inter" font-size="19" font-weight="500" fill="#efd29a" text-anchor="middle" letter-spacing="1.75"><tspan x="450" y="163">TRUSTED ADVISER OF PTOLEMY</tspan></text><text id="Biography_title_live" data-name="Biography title live" x="96" y="995" font-family="Source Serif 4" font-size="29" font-weight="400" fill="#372b40" text-anchor="start"><tspan x="96" y="995">Power Given Continuity</tspan></text><text id="Biography_live" data-name="Biography / editable paragraph" font-family="Source Serif 4" font-size="24" fill="#372b40"><tspan x="96" y="1040">A senior steward draws revenue, supply, and official</tspan><tspan x="96" y="1066">reports into a coherent view of the realm. Trusted judgment</tspan><tspan x="96" y="1092">turns separate offices into lasting government, helping</tspan><tspan x="96" y="1118">Ptolemy's authority endure beyond a single command or</tspan><tspan x="96" y="1144">campaign.</tspan></text><text id="Rarity_live" data-name="Rarity live" x="804" y="995" font-family="Inter" font-size="17" font-weight="600" fill="#372b40" text-anchor="end" letter-spacing="2"><tspan x="804" y="995">EPIC</tspan></text><text id="Everfolk_brand_live" data-name="Everfolk brand live" x="96" y="1209.972" font-family="Source Serif 4" font-size="27" font-weight="400" fill="#eee4ce" text-anchor="start" letter-spacing="1.35"><tspan x="96" y="1209.972">EVERFOLK</tspan></text><text id="Edition_number_live" data-name="Edition number live" x="816" y="1207.344" font-family="Inter" font-size="21" font-weight="400" fill="#eee4ce" text-anchor="end" letter-spacing="2.1"><tspan x="816" y="1207.344">001/025</tspan></text></g>
